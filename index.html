<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Z24 - Constructor exercises</title>
</head>

<body>
    <main class="container">
        <h1>Z24 - Exercises constructor</h1>
        <label for="inputField">Количество кругов:</label>
        <input type="number" id="inputField" min="1" placeholder="введите число кругов">
        <button id="countButton">Count</button>

        <label for="exerciseName">Название урпажнения:</label>
        <input type="text" id="exerciseName">

        <label for="exerciseReps">Количество повторений:</label>
        <input type="number" id="exerciseReps" min="1">

        <button id="addExerciseButton">Добавить упражнение</button>
        <p id="result"></p>

        <h2>Моя тренировка</h2>
        <ul id="exerciseList"></ul>

        <script src="script.js" defer></script>
    </main>
</body>

</html>
